<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AR Labs — Pioneering the frontier of augmented intelligence and next-generation AI infrastructure." />
    <title>AR LABS — Next-Gen AI Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; background: #05010f; }

      #preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.4rem;
        background: #070d1a;
        transition: opacity 0.5s ease;
      }
      #preloader.loaded { opacity: 0; pointer-events: none; }
      #preloader .pl-mark {
        width: 46px; height: 46px;
        animation: pl-pulse 1.3s ease-in-out infinite;
      }
      #preloader .pl-bar {
        width: 140px; height: 2px; border-radius: 99px;
        background: rgba(255,255,255,0.10); overflow: hidden;
      }
      #preloader .pl-bar-fill {
        width: 40%; height: 100%; border-radius: 99px;
        background: linear-gradient(90deg, #00d4ff, #a855f7);
        animation: pl-slide 1.1s ease-in-out infinite;
      }
      @keyframes pl-pulse { 0%,100% { opacity: 0.55; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes pl-slide { 0% { transform: translateX(-140%); } 100% { transform: translateX(350%); } }
    </style>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <svg class="pl-mark" viewBox="0 0 38 38" fill="none">
        <polygon points="19,3 35,32 3,32" stroke="#00d4ff" stroke-width="1.6" fill="rgba(0,212,255,0.07)" />
        <polygon points="19,11 29,30 9,30" stroke="#a855f7" stroke-width="1.1" fill="rgba(168,85,247,0.07)" />
        <circle cx="19" cy="19" r="2.4" fill="#00d4ff" />
      </svg>
      <div class="pl-bar"><div class="pl-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var start = Date.now();
        var MIN_MS = 450;
        function hide() {
          var el = document.getElementById('preloader');
          if (!el) return;
          var wait = Math.max(0, MIN_MS - (Date.now() - start));
          setTimeout(function () {
            el.classList.add('loaded');
            setTimeout(function () { el.remove(); }, 550);
          }, wait);
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
      })();
    </script>
  </body>
</html>
